<style>
/* Mismo lenguaje del panel: neutro y denso; dorado = acción, verde = entra dinero, rojo = sale */
:root { --bg:#eeede9; --surface:#ffffff; --ink:#141414; --muted:#6a655d; --line:#dcd8cf; --gold:#b8913f; --gold-ink:#141414; --soft:#f6f1e6;
  --ok:#2e7d32; --ok-bg:#e8f3e9; --bad:#b3261e; --bad-bg:#fbeae8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --display:"Lexend","Segoe UI",system-ui,sans-serif; --body:"Karla","Helvetica Neue",Arial,sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; letter-spacing: .01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid transparent; font-family: var(--display); font-weight: 500; font-size: .9rem; cursor: pointer; background: var(--ink); color: #fff; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
.btn.oro { background: var(--gold); color: var(--gold-ink); }
.btn.borde { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.peligro { background: var(--bad); }
.btn.mini { padding: 6px 12px; font-size: .8rem; }
.btn[disabled] { opacity: .55; cursor: progress; }
input[type=text], input[type=number], input[type=email], input[type=password], input[type=tel], input[type=date], input[type=month], select, textarea { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; min-height: 42px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
textarea { min-height: 120px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; font-weight: 700; min-width: 0; }
label.f small { font-weight: 400; color: var(--muted); }
.chk { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: .9rem; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--gold); }
.ayuda { font-size: .86rem; color: var(--muted); margin: 0; }
.link { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 700; text-decoration: underline; cursor: pointer; }

/* Acceso */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: linear-gradient(180deg, #5b5a56, #1c1b19 70%); }
.login form, .login .caja-msg { width: min(400px, 100%); background: var(--surface); border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 14px; }
.login img { height: 64px; width: auto; align-self: center; }
.login h1 { text-align: center; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .06em; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: .9rem; margin: 0; }
.msg.err { background: var(--bad-bg); color: var(--bad); } .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.warn { background: var(--warn-bg); color: var(--warn); }

/* Estructura */
.top { position: sticky; top: 0; z-index: 20; background: var(--ink); color: #fff; padding: 10px max(16px, 3vw); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top img { height: 34px; width: auto; filter: invert(1); }
.top h1 { font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; }
.top .yo { margin-left: auto; font-size: .82rem; opacity: .75; }
.top .btn.borde { color: #fff; border-color: rgba(255,255,255,.35); }
.tasa-top { font-size: .8rem; background: rgba(255,255,255,.1); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 max(16px, 3vw); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 54px; z-index: 19; }
.tab { padding: 14px 16px; border: 0; background: none; font-family: var(--display); font-size: .9rem; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .72rem; line-height: 20px; }
main { padding: 22px max(16px, 3vw) 60px; max-width: 1300px; margin: 0 auto; }
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.barra h2 { font-size: 1.25rem; margin-right: auto; }
.barra input, .barra select { width: auto; min-width: 150px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.vacio { padding: 30px; text-align: center; color: var(--muted); }
.sec-t { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 600; margin: 26px 0 12px; font-family: var(--display); }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi span { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.kpi b { font-family: var(--display); font-weight: 500; font-size: 1.55rem; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: .82rem; }
.kpi.verde b { color: var(--ok); } .kpi.rojo b { color: var(--bad); }
.kpi.destacado { background: var(--ink); color: #fff; border-color: var(--ink); } .kpi.destacado span, .kpi.destacado small { color: #cfc8b8; }
.alerta { margin-top: 12px; }
.dos { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.panel { padding: 18px; }
.panel h3 { font-size: .95rem; margin-bottom: 12px; }
.leyenda { display: flex; gap: 16px; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg.graf { width: 100%; height: auto; display: block; }
.hbar { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: .85rem; margin-bottom: 8px; }
.hbar .b { height: 12px; border-radius: 6px; background: var(--ink); min-width: 2px; }
.hbar .v { font-variant-numeric: tabular-nums; font-weight: 700; }
.cajas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.caja { padding: 14px 16px; }
.caja b { display: block; font-family: var(--display); font-weight: 500; font-size: 1.2rem; font-variant-numeric: tabular-nums; margin-top: 2px; }
.caja small { color: var(--muted); }
.caja .neg { color: var(--bad); }

/* Tablas */
.wrap-t { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.clic { cursor: pointer; } table.t tr.clic:hover td { background: var(--soft); }
table.t .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
.mas { color: var(--ok); } .menos { color: var(--bad); }
.sub { display: block; color: var(--muted); font-size: .8rem; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
.chip.ingreso, .chip.aporte { background: var(--ok-bg); color: var(--ok); }
.chip.gasto { background: var(--bad-bg); color: var(--bad); }
.chip.sueldo { background: #ece6f6; color: #5a3d8a; }
.chip.retiro { background: var(--warn-bg); color: var(--warn); }
.chip.transferencia { background: #e7eef6; color: #2c5282; }
.chip.est-entregado { background: var(--ok-bg); color: var(--ok); } .chip.est-anulado { background: #eee; color: #888; }
.chip.est-en-fabricacion { background: var(--warn-bg); color: var(--warn); } .chip.est-listo-para-entregar { background: #e7eef6; color: #2c5282; }

/* Formularios y hoja lateral */
.hoja { position: fixed; inset: 0; z-index: 40; background: rgba(15,14,13,.55); display: flex; justify-content: flex-end; }
.hoja > div { width: min(760px, 100%); height: 100%; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; }
.hoja header { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.hoja header h2 { font-size: 1.1rem; margin-right: auto; }
.form { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.bloque { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.bloque > h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); font-weight: 600; }
.fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-family: var(--display); font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.equiv { font-family: var(--display); font-size: .95rem; margin: -4px 0 0; color: var(--muted); }
.equiv b { color: var(--ink); font-weight: 500; }
.confirma { background: var(--bad-bg); border: 1px solid #f0c4bf; border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.resumen-v { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.resumen-v div { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.resumen-v span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.resumen-v b { font-family: var(--display); font-weight: 500; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.lista-cot { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.lista-cot button { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
.lista-cot button:hover { border-color: var(--gold); }
.anotar { max-width: 640px; }
.arts { display: flex; flex-direction: column; gap: 10px; }
.art { display: grid; grid-template-columns: 2fr 0.8fr 0.9fr 1fr; gap: 8px 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
.art .art-n { grid-column: 1 / 2; } .art .art-c { grid-column: 1 / 3; }
.art .art-s { grid-column: 3 / 5; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.art .art-s b { font-family: var(--display); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.art input, .art select { min-height: 40px; background: #fff; }
@media (max-width: 640px) { .art { grid-template-columns: 1fr 1fr; } .art .art-n, .art .art-c { grid-column: 1 / -1; } .art .art-s { grid-column: 1 / -1; } }
.emp { margin-bottom: 14px; overflow: hidden; }
.emp-cab { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--soft); }
.emp-cab h3 { font-size: 1.05rem; margin-right: auto; }
.emp-cab .cod { font-family: var(--display); font-size: .8rem; letter-spacing: .08em; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; margin-left: 6px; }
.emp-cab .tot { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.codigo-grande { font-family: var(--display); font-size: 1.6rem; letter-spacing: .1em; }
.chips-sel { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-sel label { display: inline-flex; gap: 6px; align-items: center; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; font-weight: 600; font-size: .88rem; }
.chips-sel input { accent-color: var(--gold); width: 16px; height: 16px; }
table.t.eq td { vertical-align: middle; }
table.t.eq select, table.t.eq input { min-height: 36px; padding: 6px 8px; }
.solo-movil { display: none !important; }
@media (max-width: 640px) { .solo-movil { display: block !important; } }
.pct { width: 78px !important; text-align: right; }
.emp table.t { table-layout: fixed; min-width: 620px; }
.emp table.t td:nth-child(1) { width: 96px; } .emp table.t td:nth-child(3) { width: 150px; }
.emp table.t td:nth-child(4) { width: 110px; } .emp table.t td:nth-child(5) { width: 100px; } .emp table.t td:nth-child(6) { width: 110px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .9rem; max-width: calc(100% - 32px); }
@media (max-width: 860px) { .dos { grid-template-columns: 1fr; } .resumen-v { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .top .yo { display: none; } .tasa-top { margin-left: auto; }
  .barra input, .barra select { min-width: 0; flex: 1 1 140px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi { padding: 12px 14px; } .kpi.destacado, .kpi.ancho { grid-column: 1 / -1; }
  .kpi b { font-size: 1.2rem; } .kpi span { font-size: .7rem; }
  .barra h2 { flex-basis: 100%; }
  table.t th, table.t td { padding: 9px 8px; }
  .ocultar-movil { display: none; }
  .emp table.t { table-layout: auto; min-width: 0; }
  .emp table.t td:nth-child(3), .emp table.t td:nth-child(4) { display: none; }
  .emp table.t td:nth-child(1) { width: 70px; font-size: .82rem; } .emp table.t td:nth-child(5), .emp table.t td:nth-child(6) { width: auto; }
  .emp-cab { padding: 12px 14px; }
}

const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ===== Números y fechas (formato venezolano: 1.234,56) ===== */
const num = s => { if (typeof s === "number") return isFinite(s) ? s : 0; s = String(s == null ? "" : s).trim().replace(/[^\d.,-]/g, ""); if (!s) return 0; if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); else if ((s.match(/\./g) || []).length > 1 || /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g, ""); /* 1.200 = mil doscientos */ const n = parseFloat(s); return isFinite(n) ? n : 0; };
const fmtN = n => (Math.round((n || 0) * 100) / 100).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtU = n => (n < 0 ? "-$" : "$") + fmtN(Math.abs(n || 0));
const fmtM = (n, mon) => mon === "VES" ? "Bs " + fmtN(n) : fmtU(n);
const inNum = n => n ? String(Math.round(n * 100) / 100).replace(".", ",") : "";
const numP = s => typeof s === "number" ? s : (parseFloat(String(s || "").replace(/[^\d.,-]/g, "").replace(",", ".")) || 0); /* porcentajes: 8.333 o 8,333 */
const fmtP = n => (Math.round((n || 0) * 100) / 100).toLocaleString("es-VE", { maximumFractionDigits: 2 });
const inPct = n => n ? String(Math.round(n * 1000) / 1000).replace(".", ",") : "";
const hoy = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const nombreMes = m => MESES[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const mesCorto = m => MESES[+m.slice(5, 7) - 1].slice(0, 3);
const fechaCorta = f => f ? f.slice(8, 10) + "/" + f.slice(5, 7) + "/" + f.slice(2, 4) : "";
const mesMas = (m, k) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + k, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const diasDesde = f => Math.max(0, Math.round((new Date(hoy()) - new Date(f)) / 864e5));

const movsOrdenados = arr => arr.slice().sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || String(b.id).localeCompare(String(a.id)));
const cuenta = id => CUENTAS.find(c => c.id === id);

/* Saldos y cálculos */
function saldo(c){
  let s = num(c.inicial);
  for (const m of MOVS) {
    if (m.cuenta === c.id) s += (m.tipo === "ingreso" || m.tipo === "aporte" ? 1 : -1) * (m.monto || 0);
    if (m.tipo === "transferencia" && m.cuentaDestino === c.id) s += m.montoDestino || 0;
  }
  return s;
}
const aUSD = (monto, mon) => mon === "VES" ? (AJ.tasa && AJ.tasa.valor ? monto / AJ.tasa.valor : 0) : monto;
const cobrado = v => MOVS.filter(m => m.ventaId === v.id && m.tipo === "ingreso").reduce((a, m) => a + (m.usd || 0), 0);
const costo = v => MOVS.filter(m => m.ventaId === v.id && m.tipo === "gasto").reduce((a, m) => a + (m.usd || 0), 0);
const saldoVenta = v => v.estado === "Anulado" ? 0 : Math.max(0, num(v.total) - cobrado(v));
function totalesMes(m){
  const t = { ingreso: 0, gasto: 0, sueldo: 0, retiro: 0, aporte: 0, cat: {} };
  for (const x of MOVS) if ((x.fecha || "").startsWith(m) && x.tipo in t) {
    t[x.tipo] += x.usd || 0;
    if (x.tipo === "gasto") {
      const ls = (x.lineas || []).filter(l => l.sub > 0), tot = ls.reduce((s, l) => s + l.sub, 0);
      if (ls.length && tot) ls.forEach(l => { const c = l.cat || "Otros gastos"; t.cat[c] = (t.cat[c] || 0) + (x.usd || 0) * l.sub / tot; });
      else t.cat[x.categoria || "Otros gastos"] = (t.cat[x.categoria || "Otros gastos"] || 0) + (x.usd || 0);
    }
  }
  t.utilidad = t.ingreso - t.gasto; t.queda = t.utilidad - t.sueldo - t.retiro;
  return t;
}
/* ===== Dos bancos: uno para el día a día (Banesco) y otro de resguardo (Mercantil) =====
   De cada cobro de venta se aparta un % al banco de resguardo, dividido en tres potes. */
const POTES = { gastos: "Gastos fijos", reserva: "Reserva", dueno: "Ganancia del dueño" };
const POTES_AYUDA = { gastos: "Luz, agua, aseo, teléfono, internet", reserva: "Herramientas, reparaciones, emergencias, meses flojos", dueno: "Tu sueldo y tu ganancia" };
const bancosListos = () => gestor() && !!(PRIV.bancos && PRIV.bancos.resguardo && cuenta(PRIV.bancos.resguardo));
const pctTotal = () => { const p = PRIV.bancos.pct; return num(p.gastos) + num(p.reserva) + num(p.dueno); };
const esCobroVenta = m => m.tipo === "ingreso" && (!!m.ventaId || /venta|reparaci|tapiz/i.test(m.categoria || ""));
const potePorDefecto = (tipo, sale) => sale ? (tipo === "gasto" ? "gastos" : tipo === "transferencia" ? "reserva" : "dueno") : "reserva";
function pendientesApartar(){
  if (!bancosListos()) return [];
  const b = PRIV.bancos, hechos = new Set(MOVS.filter(m => m.repartoDe).map(m => m.repartoDe));
  return movsOrdenados(MOVS).filter(m => esCobroVenta(m) && !m.sinReparto && !hechos.has(m.id) && m.cuenta !== b.resguardo && (m.fecha || "") >= (b.desde || ""));
}
function saldoPotes(){
  const b = PRIV.bancos, r = { gastos: 0, reserva: 0, dueno: 0 }, c = cuenta(b.resguardo);
  if (!c) return r;
  r.reserva += aUSD(num(c.inicial), c.moneda);
  for (const m of MOVS) {
    if (m.tipo === "transferencia" && m.cuentaDestino === b.resguardo && m.cuenta !== b.resguardo) {
      if (m.reparto) for (const k in r) r[k] += num(m.reparto[k]); else r[m.pote || "reserva"] += m.usd || 0;
    }
    if (m.cuenta === b.resguardo) {
      if (m.tipo === "ingreso" || m.tipo === "aporte") r[m.pote || "reserva"] += m.usd || 0;
      else if (!(m.tipo === "transferencia" && m.cuentaDestino === b.resguardo)) r[m.pote || potePorDefecto(m.tipo, true)] -= m.usd || 0;
    }
  }
  return r;
}
function calcReparto(usd){
  const p = PRIV.bancos.pct, r2 = n => Math.round(n * 100) / 100;
  const parte = { gastos: r2(usd * num(p.gastos) / 100), reserva: r2(usd * num(p.reserva) / 100), dueno: r2(usd * num(p.dueno) / 100) };
  return { parte, total: r2(parte.gastos + parte.reserva + parte.dueno) };
}

const sueldoEsperado = () => num(PRIV.sueldo.monto) * (VECES[PRIV.sueldo.frecuencia] || 1);

function grafMeses(serie){

  const lineas = [0, .5, 1].map(k => `<line x1="0" x2="${W}" y1="${y(max * k)}" y2="${y(max * k)}" stroke="#dcd8cf" stroke-dasharray="${k ? "3 4" : ""}"/>` + (k ? `<text x="2" y="${y(max * k) - 4}" font-size="11" fill="#6a655d">${fmtU(max * k).replace(/,00$/, "")}</text>` : "")).join("");
  const barras = serie.map((s, k) => { const cx = paso * k + paso / 2;
    return `<rect x="${cx - bw - 2}" y="${y(s.i)}" width="${bw}" height="${H - pb - y(s.i)}" rx="4" fill="#b8913f"><title>${nombreMes(s.m)}: entró ${fmtU(s.i)}</title></rect>
      <rect x="${cx + 2}" y="${y(s.g)}" width="${bw}" height="${H - pb - y(s.g)}" rx="4" fill="#141414"><title>${nombreMes(s.m)}: gastos ${fmtU(s.g)}</title></rect>
      <text x="${cx}" y="${H - 7}" font-size="12" text-anchor="middle" fill="${s.m === MES ? "#141414" : "#6a655d"}" font-weight="${s.m === MES ? 700 : 400}">${mesCorto(s.m)}</text>`; }).join("");
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas y gastos de los últimos 6 meses">${lineas}${barras}</svg>`;
}

function waLink(v, saldo){
  let t = String(v.telefono || "").replace(/\D/g, ""); if (t.startsWith("0")) t = "58" + t.slice(1); else if (t.length === 10) t = "58" + t;

  return `https://wa.me/${t}?text=${encodeURIComponent(msg)}`;
}

/* ===== EMPLEADOS Y NÓMINA =====
   Cada venta es un proyecto. En el proyecto se asigna quién trabajó:
   - Ejecutivo de ventas: su propio % del precio.
   - Producción (picador, armador, tapicero, corte y costura): un % total según cuántos trabajaron,
     repartido en partes iguales. Cada línea guarda su fecha (semana de nómina) y si ya se pagó. */
const r2 = n => Math.round((n || 0) * 100) / 100;
const empleado = id => EMPLEADOS.find(e => e.id === id);
const telWa = t => { t = String(t || "").replace(/\D/g, ""); if (t.startsWith("0")) t = "58" + t.slice(1); else if (t.length === 10) t = "58" + t; return t; };
/* Una venta puede tener varios productos (items). Cada item tiene su precio y su propio equipo.
   Las ventas viejas (sin items) se ven como un solo item que comparte el equipo de la venta. */
const baseDe = it => num(it.baseComision) || num(it.precio) || num(it.total);
function itemsDe(v){
  if (v.items && v.items.length) return v.items;
  if (!v._legado) Object.defineProperty(v, "_legado", { enumerable: false, configurable: true, writable: true,
    value: [{ id: "p1", producto: v.producto || "", cantidad: 1, get precio(){ return num(v.total); }, detalle: v.detalle || "",
      get equipo(){ return v.equipo || (v.equipo = []); }, set equipo(a){ v.equipo = a; }, baseComision: v.baseComision, pctEquipo: v.pctEquipo, pctEquipoManual: v.pctEquipoManual, pctIndividual: v.pctIndividual }] });
  return v._legado;
}
const guardarEquipoVenta = v => db.collection("ventas").doc(v.id).update(v.items && v.items.length ? { items: v.items } : { equipo: v.equipo || [] });
function recalcEquipo(v){
  v.equipo = (v.equipo || []).filter(l => l.empleadoId);
  const base = baseDe(v), prod = v.equipo.filter(l => l.rol !== ROL_VENTAS);
  /* % a mano por trabajador: cada uno cobra su propio %; el total del equipo es la suma */
  if (v.pctIndividual) {
    v.equipo.forEach(l => { if (!l.pagado) l.monto = r2(base * num(l.pct) / 100); });
    v.pctEquipo = r2(prod.reduce((a, l) => a + num(l.pct), 0)); v.pctEquipoManual = false;
    return;
  }
  if (!v.pctEquipoManual) v.pctEquipo = prod.length ? num(PRIV.comisiones.equipo[Math.min(prod.length, 4)]) : 0;
  const cada = prod.length ? num(v.pctEquipo) / prod.length : 0;
  v.equipo.forEach(l => { if (l.pagado) return;
    if (l.rol !== ROL_VENTAS) { l.pct = r2(cada); l.monto = r2(base * cada / 100); } else l.monto = r2(base * num(l.pct) / 100); });
}
const comisionesItem = it => (it.equipo || []).reduce((a, l) => a + (l.monto || 0), 0);
const totalComisiones = v => itemsDe(v).reduce((a, it) => a + comisionesItem(it), 0);
const lineasNomina = () => VENTAS.flatMap(v => itemsDe(v).flatMap(it => (it.equipo || []).filter(l => l.empleadoId && l.monto > 0 && (v.estado !== "Anulado" || l.pagado)).map(l => Object.assign({}, l, { venta: v, item: it }))));
async function desmarcarNomina(movId){
  for (const v of VENTAS) {
    const ls = itemsDe(v).flatMap(it => (it.equipo || []).filter(l => l.pagoMovId === movId)); if (!ls.length) continue;
    ls.forEach(l => { l.pagado = false; l.pagoMovId = ""; l.pagadoFecha = ""; });
    await guardarEquipoVenta(v).catch(e => console.error(e));
  }
}

/* Tabla del equipo de un producto (k = posición del producto en la venta) */
function bloqueEquipo(x, k){
  if (!gestor()) return "";
  if (!EMPLEADOS.length) return `<p class="ayuda">Registra a tus empleados en la pestaña <b>Empleados</b> para asignar quién fabrica este producto.</p>`;
  const act = EMPLEADOS.filter(e => e.activo !== false);
  const linea = rol => (x.equipo || []).find(l => l.rol === rol);
  const prodN = (x.equipo || []).filter(l => l.rol !== ROL_VENTAS).length;
  const fila = rol => {
    const l = linea(rol), conCargo = act.filter(e => (e.roles || []).includes(rol));
    const opts = (conCargo.length ? conCargo : act).slice(); if (l && !opts.some(e => e.id === l.empleadoId) && empleado(l.empleadoId)) opts.push(empleado(l.empleadoId));
    return `<tr><td><b>${rol}</b></td>
      <td><select data-eq-emp="${k}|${rol}" ${l && l.pagado ? "disabled" : ""} aria-label="${rol}"><option value="">${rol === ROL_VENTAS ? "— Sin ejecutivo —" : "— No trabajó —"}</option>${opts.map(e => `<option value="${e.id}" ${l && l.empleadoId === e.id ? "selected" : ""}>${esc(e.nombre)} · ${esc(e.codigo || "")}</option>`).join("")}</select></td>
      <td class="num">${l ? (!l.pagado ? `<input class="pct" type="text" inputmode="decimal" data-eq-pct="${k}|${rol}" value="${inPct(l.pct)}" aria-label="% de ${rol}">` : fmtP(l.pct)) + "%" : ""}</td>
      <td class="num"><b>${l ? fmtU(l.monto) : ""}</b></td>
      <td>${l ? (l.pagado ? `<span class="chip ingreso">Pagado ${fechaCorta(l.pagadoFecha)}</span>` : `<input type="date" data-eq-fecha="${k}|${rol}" value="${l.fecha}" aria-label="Fecha de trabajo">`) : ""}</td></tr>`;
  };
  return `<h3 style="margin-top:6px">Equipo que lo fabrica</h3>
    <p class="ayuda">La <b>fecha</b> decide en qué semana de nómina (sábado a viernes) se le paga a cada uno.</p>
    <div class="fila"><label class="f">Precio para comisiones <small>normalmente el precio de esta línea</small><input type="text" inputmode="decimal" data-eq-base="${k}" value="${inNum(baseDe(x))}"></label>
      <label class="f">% del equipo de producción <small>${x.pctIndividual ? `cada uno con su % · suma de los ${prodN} · <button type="button" class="link" data-eq-auto="${k}">repartir en partes iguales</button>` : `${prodN ? `${prodN} trabajando · ${fmtP(num(x.pctEquipo) / prodN)}% cada uno` : "nadie asignado"}${x.pctEquipoManual ? ` · cambiado a mano · <button type="button" class="link" data-eq-auto="${k}">volver al automático</button>` : ""}`}</small><input type="text" inputmode="decimal" data-eq-pcteq="${k}" value="${inPct(num(x.pctEquipo))}" ${x.pctIndividual ? "readonly" : ""}></label></div>
    <p class="ayuda">¿A uno le toca más que a otro? Escribe el <b>%</b> de cada trabajador en la tabla y se deja de repartir en partes iguales.</p>
    <div class="wrap-t"><table class="t eq"><thead><tr><th>Cargo</th><th>Empleado</th><th class="num">%</th><th class="num">Le toca</th><th>Fecha</th></tr></thead><tbody>${ROLES.map(fila).join("")}</tbody>
      <tfoot><tr><td colspan="3">Comisiones de este producto</td><td class="num">${fmtU(comisionesItem(x))}</td><td></td></tr></tfoot></table></div>`;
}
function eventosEquipo(ed, items, render){
  const par = s => { const [k, rol] = s.split("|"); return [items[+k], rol]; };
  const linea = (it, rol) => (it.equipo || []).find(l => l.rol === rol);
  ed.querySelectorAll("[data-eq-emp]").forEach(sel => sel.addEventListener("change", () => {
    const [it, rol] = par(sel.dataset.eqEmp), previa = linea(it, rol); it.equipo = (it.equipo || []).filter(l => l.rol !== rol);
    if (sel.value) { const e = empleado(sel.value);
      it.equipo.push({ id: slug(rol), rol, empleadoId: sel.value, pct: rol === ROL_VENTAS ? (num(e && e.pctVenta) || num(PRIV.comisiones.ventas)) : it.pctIndividual ? ((previa && num(previa.pct)) || num(PRIV.comisiones.equipo[1]) || 5) : 0, monto: 0, fecha: (previa && previa.fecha) || hoy(), pagado: false }); }
    render();
  }));
  ed.querySelectorAll("[data-eq-pct]").forEach(i => i.addEventListener("change", () => { const [it, rol] = par(i.dataset.eqPct); linea(it, rol).pct = numP(i.value);
    if (rol !== ROL_VENTAS && !it.pctIndividual) { it.pctIndividual = true; (it.equipo || []).forEach(l => { if (l.rol !== ROL_VENTAS && l.rol !== rol && !l.pagado) l.pct = r2(num(l.pct)); }); }
    setTimeout(render, 0); }));
  ed.querySelectorAll("[data-eq-fecha]").forEach(i => i.addEventListener("change", () => { const [it, rol] = par(i.dataset.eqFecha); linea(it, rol).fecha = i.value || hoy(); }));
  ed.querySelectorAll("[data-eq-base]").forEach(i => i.addEventListener("change", () => { items[+i.dataset.eqBase].baseComision = num(i.value); setTimeout(render, 0); }));
  ed.querySelectorAll("[data-eq-pcteq]").forEach(i => i.addEventListener("change", () => { const it = items[+i.dataset.eqPcteq]; it.pctEquipo = numP(i.value); it.pctEquipoManual = true; setTimeout(render, 0); }));
  ed.querySelectorAll("[data-eq-auto]").forEach(b => b.addEventListener("click", () => { const it = items[+b.dataset.eqAuto]; it.pctEquipoManual = false; it.pctIndividual = false; setTimeout(render, 0); }));
}

function codigoEmp(ced, nac, idAct){
  const c = String(ced || "").replace(/\D/g, ""); if (c.length < 4 || !/^\d{4}-\d{2}-\d{2}$/.test(nac || "")) return "";
  const base = c.slice(-4) + "-" + nac.slice(8, 10) + nac.slice(5, 7) + nac.slice(2, 4); let cod = base, k = 0;
  while (EMPLEADOS.some(e => e.codigo === cod && e.id !== idAct)) cod = base + "-" + "ABCDEFGHIJ"[k++];
  return cod;
}

   - "trabajos": copia de las líneas de nómina SIN cliente ni precio de venta, para que cada empleado vea las suyas.

/* Revisa que cada empleado con acceso tenga su llave de entrada (y la crea si falta) */

async function cargarPersonal(){

/* Copia ordenada (para comparar sin importar el orden de las llaves) */
const estable = o => JSON.stringify(Object.keys(o).sort().reduce((a, k) => (a[k] = o[k], a), {}));

async function sincronizarTrabajos(){
  if (!gestor()) return;
  const quiero = {};
  lineasNomina().filter(l => empleado(l.empleadoId)).forEach(l => {
    const e = empleado(l.empleadoId), id = `${l.venta.id}_${l.item.id}_${l.id}`.replace(/\//g, "-");
    quiero[id] = { empleadoId: l.empleadoId, email: (e && e.acceso && e.acceso.activo !== false && e.acceso.email) || "", fecha: l.fecha || "", semana: viernesDe(l.fecha || hoy()),

/* Crea la cuenta del empleado con su correo y le envía el enlace para que él mismo cree su contraseña */
async function darAccesoPortal(emp, correo){
  const email = String(correo || "").trim().toLowerCase();
  if (!correoValido(email)) throw new Error("Escribe un correo válido.");
  if (email === DUENO) throw new Error("Ese es tu correo de dueño: usa el correo del empleado.");
  const otro = EMPLEADOS.find(e => e.id !== emp.id && e.acceso && e.acceso.email === email);
  if (otro) throw new Error(`Ese correo ya lo usa ${otro.nombre}.`);
  const sec = (firebase.apps || []).find(a => a.name === "personal") || firebase.initializeApp(FIREBASE_CONFIG, "personal");
  const clave = Array.from(crypto.getRandomValues(new Uint8Array(18)), b => b.toString(36)).join("") + "Aa1";
  try { await sec.auth().createUserWithEmailAndPassword(email, clave); } catch (e) { if (!/email-already-in-use/.test(e.code || "")) throw e; }
  await sec.auth().signOut().catch(() => {});
  await auth.sendPasswordResetEmail(email);
  const acceso = { activo: true, email, desde: hoy(), tipo: "correo" };
  await db.collection("empleados").doc(emp.id).update({ acceso, email });
  for (const a of ASIST.filter(a => a.empleadoId === emp.id && a.email !== email)) { await db.collection("asistencias").doc(a.id).update({ email }); a.email = email; }
  Object.assign(empleado(emp.id), { acceso, email });

}

}

    const b = $("as-geo"); b.disabled = true; b.textContent = "Buscando ubicación…";
    navigator.geolocation.getCurrentPosition(async p => {
      CFGP.taller = { lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy) };
      try { await guardarCfg(`Ubicación del taller guardada (precisión ±${Math.round(p.coords.accuracy)} m).`); } catch (e) { toast("No se pudo guardar."); }
    }, err => { b.disabled = false; b.textContent = "Guardar mi ubicación actual como el taller"; toast(err.code === 1 ? "Permite el acceso a la ubicación en el navegador." : "No se pudo obtener la ubicación."); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
  if ($("as-geo-x")) $("as-geo-x").addEventListener("click", async () => { CFGP.taller = null; try { await guardarCfg("Ubicación quitada."); } catch (e) {} });
}
function corregirAsistencia(emp, fecha){
  const ed = $("editor-in"); $("editor").hidden = false; document.body.style.overflow = "hidden"; $("editor").firstElementChild.scrollTop = 0;
  const id = `${emp.id}_${fecha}`, a = ASIST.find(z => z.id === id), te = a && tsDate(a.entrada), ts = a && tsDate(a.salida);
  const hv = d => d ? String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") : "";
  ed.innerHTML = `<header><h2>${esc(emp.nombre)} · ${fechaCorta(fecha)}</h2><button class="btn borde mini" id="co-x">Cerrar</button></header>
    <div class="form"><div class="bloque"><h3>${a ? "Corregir marca" : "Anotar asistencia"}</h3>
      <div class="fila"><label class="f">Entrada<input type="time" id="co-e" value="${hv(te) || (horarioDe(fecha) || {}).e || "08:00"}"></label><label class="f">Salida <small>vacío si sigue en el taller</small><input type="time" id="co-s" value="${hv(ts)}"></label></div>
      <label class="f">Motivo<input type="text" id="co-n" value="${esc((a && a.corregido && a.corregido.nota) || "")}" placeholder="Ej: olvidó marcar la salida"></label>
      <p class="ayuda">Queda anotado como corregido por ti.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn oro" id="co-ok">GUARDAR</button>${a ? `<button class="btn borde" id="co-del">Borrar este registro</button>` : ""}</div></div></div>`;
  $("co-x").addEventListener("click", cerrarEditor);
  const aFecha = t => { if (!t) return null; const [H, M] = t.split(":").map(Number), d = new Date(fecha + "T00:00:00"); d.setHours(H, M, 0, 0); return firebase.firestore.Timestamp.fromDate(d); };
  $("co-ok").addEventListener("click", async () => {
    const e = aFecha($("co-e").value), s = aFecha($("co-s").value); if (!e) return toast("Escribe la hora de entrada.");
    const d = Object.assign({ empleadoId: emp.id, email: (emp.acceso && emp.acceso.email) || "", nombre: emp.nombre, fecha, ubicEntrada: null, ubicSalida: null }, a ? { ubicEntrada: a.ubicEntrada || null, ubicSalida: a.ubicSalida || null } : {},
      { entrada: e, salida: s, corregido: { nota: $("co-n").value.trim(), fecha: hoy() } });
    try { await db.collection("asistencias").doc(id).set(d); ASIST = ASIST.filter(z => z.id !== id).concat([Object.assign({ id }, d)]); cerrarEditor(); pintarAsistencia(); toast("Asistencia guardada."); }
    catch (err) { console.error(err); toast("No se pudo guardar."); }
  });
  if ($("co-del")) $("co-del").addEventListener("click", async () => { try { await db.collection("asistencias").doc(id).delete(); ASIST = ASIST.filter(z => z.id !== id); cerrarEditor(); pintarAsistencia(); toast("Registro borrado."); } catch (e) { toast("No se pudo borrar."); } });
}

/* ===== EXCEL ===== */
function cargarScript(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function exportar(mes, movs){
  const ls = movs || movsOrdenados(MOVS).filter(m => !mes || (m.fecha || "").startsWith(mes));
  const hojaCompras = [["Fecha", "Proveedor", "Artículo", "Cantidad", "Unidad", "Precio c/u", "Moneda", "Subtotal", "Subtotal $", "Categoría", "Caja"],
    ...ls.filter(m => (m.lineas || []).length).flatMap(m => { const tot = m.lineas.reduce((s, l) => s + l.sub, 0) || 1;
      return m.lineas.map(l => [m.fecha, m.proveedor || "", l.art, l.cant, l.uni, l.pu, m.moneda === "VES" ? "Bs" : "$", l.sub, Math.round((m.usd || 0) * l.sub / tot * 100) / 100, l.cat, nomCuenta(m.cuenta)]); })];
  const hojaMov = [["Fecha", "Tipo", "Categoría", "Proveedor", "Descripción", "Caja", "Moneda", "Monto", "Tasa", "Equivalente $", "Caja destino", "Monto destino", "Venta", "Cliente", "Referencia", "Anotado por"],
    ...ls.map(m => { const v = venta(m.ventaId) || {}; return [m.fecha, (TIPOS[m.tipo] || {}).n || m.tipo, m.categoria, m.proveedor || "", m.descripcion, nomCuenta(m.cuenta), m.moneda === "VES" ? "Bs" : "$", m.monto, m.tasa || "", m.usd,
      m.cuentaDestino ? nomCuenta(m.cuentaDestino) : "", m.montoDestino || "", v.numero || "", v.cliente || "", m.ref, m.creadoPor]; })];
  const hojaVen = [["N°", "Fecha", "Cliente", "Teléfono", "Producto", "Estado", "Total $", "Cobrado $", "Saldo $", "Costos $", "Comisiones $", "Ganancia $"],
    ...VENTAS.filter(v => !mes || (v.fecha || "").startsWith(mes) || saldoVenta(v) > 0.009).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""))
      .map(v => [v.numero, v.fecha, v.cliente, v.telefono, v.producto, v.estado, num(v.total), cobrado(v), saldoVenta(v), costo(v), totalComisiones(v), num(v.total) - costo(v) - totalComisiones(v)])];
  const hojaNom = [["Fecha", "Semana (viernes)", "Empleado", "Código", "Cargo", "Venta", "Cliente", "Producto", "%", "Monto $", "Pagado"],
    ...lineasNomina().filter(l => !mes || l.fecha.startsWith(mes)).sort((a, b) => a.fecha.localeCompare(b.fecha))
      .map(l => { const e = empleado(l.empleadoId) || {}; return [l.fecha, viernesDe(l.fecha), e.nombre || "", e.codigo || "", l.rol, l.venta.numero || "", l.venta.cliente || "", l.item.producto || l.venta.producto || "", l.pct, l.monto, l.pagado ? "Sí" : "No"]; })];
  const hojaCaj = [["Caja", "Moneda", "Saldo hoy", "Equivalente $ (tasa " + fmtN((AJ.tasa || {}).valor) + ")"], ...CUENTAS.map(c => [c.nombre, c.moneda === "VES" ? "Bs" : "$", saldo(c), aUSD(saldo(c), c.moneda)])];
  const hojas = [];
  if (mes) { const t = totalesMes(mes);
    hojas.push(["Resumen", [["Muebles Ideal · " + nombreMes(mes)], [], ["Entró (ingresos) $", t.ingreso], ["Gastos del negocio $", t.gasto], ["Utilidad $", t.utilidad], ["Sueldo del dueño $", t.sueldo], ["Retiros personales $", t.retiro], ["Aportes del dueño $", t.aporte], ["Quedó en el negocio $", t.queda], [], ["Gastos por categoría"], ...Object.entries(t.cat).sort((a, b) => b[1] - a[1])]]); }
  hojas.push(["Movimientos", hojaMov]); if (hojaCompras.length > 1) hojas.push(["Detalle de compras", hojaCompras]);
  hojas.push(["Ventas", hojaVen], ["Nómina", hojaNom], ["Cajas", hojaCaj]);
  const nombre = "Contabilidad-MueblesIdeal-" + (mes || "todo");
  toast("Preparando Excel…");
  try {
    if (!window.XLSX) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.utils.book_new();
    for (const [n, filas] of hojas) { const ws = XLSX.utils.aoa_to_sheet(filas); ws["!cols"] = filas[0].map((_, i) => ({ wch: Math.min(40, Math.max(10, ...filas.map(f => String(f[i] == null ? "" : f[i]).length + 2))) })); XLSX.utils.book_append_sheet(wb, ws, n); }
    XLSX.writeFile(wb, nombre + ".xlsx"); toast("Excel descargado.");
  } catch (e) {
    console.error(e);
    const csv = "﻿" + hojaMov.map(f => f.map(v => { const s = typeof v === "number" ? String(Math.round(v * 100) / 100).replace(".", ",") : String(v == null ? "" : v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(";")).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })), a = document.createElement("a");
    a.href = url; a.download = nombre + ".csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast("Se descargó en formato CSV (se abre con Excel).");
  }
}

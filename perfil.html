/* Perfil de cada persona del equipo. Colores en tema.css. */
:root { --display:Lexend, system-ui, sans-serif; --body:Karla, system-ui, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }

/* Encabezado blanco con flecha para volver */
.cab { position: sticky; top: 0; z-index: 30; background: var(--barra-bg); -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5); border-bottom: 1px solid var(--barra-linea); padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }

.portada { background: var(--grad-hero); color: #fff; text-align: center; padding: 26px 16px 56px; }
.foto { position: relative; width: 116px; height: 116px; margin: 0 auto 14px; }
.foto .img { width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(255,255,255,.9); background: rgba(255,255,255,.18) center/cover; display: grid; place-items: center; font-family: var(--display); font-size: 2.6rem; font-weight: 600; box-shadow: 0 12px 30px -12px rgba(0,0,0,.5); }
.foto label { position: absolute; right: 2px; bottom: 4px; width: 36px; height: 36px; border-radius: 50%; background: var(--amarillo); color: var(--amarillo-txt); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 10px -4px rgba(0,0,0,.5); border: 2px solid #fff; }

main { max-width: 760px; margin: -36px auto 0; padding: 0 14px calc(110px + env(safe-area-inset-bottom, 0px)); position: relative; }

/* Documentos */

.subir { border: 2px dashed var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; background: var(--campo); }

.archivo { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 14px; background: var(--soft); color: var(--azul-fuerte); font-weight: 700; cursor: pointer; text-align: center; padding: 10px; }

.filtros { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }

.filtros button[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #fff; }

/* Visor de documento */
.visor { position: fixed; inset: 0; z-index: 60; background: rgba(7,15,42,.75); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.visor .hoja { width: min(640px, 100%); max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: sube .3s cubic-bezier(.2,.9,.3,1); }
@media (min-width: 700px) { .visor { align-items: center; } .visor .hoja { border-radius: 26px; } }
.visor .hoja img { width: 100%; border-radius: 14px; background: var(--soft); margin: 12px 0; }
.visor .acc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.visor .acc .btn { flex: 1 1 130px; }

/* Directorio del equipo (solo dueño) */
.gente { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.persona { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 20px; background: var(--surface); box-shadow: var(--sombra); text-decoration: none; color: var(--ink); position: relative; transition: transform .15s; animation: sube .45s cubic-bezier(.2,.9,.3,1) both; }
.persona:hover { transform: translateY(-2px); }
.persona .av { width: 54px; height: 54px; flex: none; border-radius: 50%; background: linear-gradient(135deg, #c9b6ff, #9fb7ff) center/cover; display: grid; place-items: center; font-family: var(--display); font-weight: 600; color: #0c2572; font-size: 1.2rem; }
.persona div { min-width: 0; flex: 1; }
.persona b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.persona small { color: var(--muted); display: block; }
.persona .mb { height: 5px; border-radius: 999px; background: var(--soft); margin-top: 6px; overflow: hidden; }
.persona .mb i { display: block; height: 100%; background: var(--azul); }
.persona .nuevo { position: absolute; top: 10px; right: 10px; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bad); color: #fff; }
.titulo-dir { margin: 22px 4px 12px; font-family: var(--display); font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.guardar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--barra-bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--barra-linea); }
.guardar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.guardar .btn { flex: 1; }
.guardar span { font-size: .84rem; color: var(--muted); flex: 1; }
.msg { padding: 10px 12px; border-radius: 12px; font-size: .9rem; margin: 0 0 12px; }
.msg.err { background: var(--bad-bg); color: var(--bad); } .msg.ok { background: var(--ok-bg); color: var(--ok); }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--marino); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: .92rem; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.cargando { text-align: center; color: var(--muted); padding: 60px 16px; }
@keyframes sube { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBJXjU2TUQvCa7xxe1bEa8WchLrn8LDsyM",

const auth = firebase.auth(), db = firebase.firestore(), FV = firebase.firestore.FieldValue;
const DUENO = "mueblesideal2020@gmail.com";

const fecha = f => { if (!f) return ""; const [a, m, d] = String(f).slice(0, 10).split("-"); return `${+d} ${MESES[+m - 1]} ${a}`; };
const tsFecha = t => { const d = t && t.toDate ? t.toDate() : t && t.seconds ? new Date(t.seconds * 1000) : null; return d ? d.toLocaleDateString("es-VE", { day: "numeric", month: "short", year: "numeric" }) : ""; };
const hoy = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const peso = n => n > 1048576 ? (n / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
/* Tiempo en la empresa: "2 años y 3 meses" */
function antiguedad(f){
  if (!f) return "";
  const a = new Date(f + "T12:00:00"), b = new Date(); let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth(); if (b.getDate() < a.getDate()) m--;
  if (m < 0) return ""; if (m < 1) return "menos de un mes";
  const y = Math.floor(m / 12), r = m % 12, t = [];
  if (y) t.push(y + (y === 1 ? " año" : " años")); if (r) t.push(r + (r === 1 ? " mes" : " meses"));
  return t.join(" y ");
}
const edad = f => { if (!f) return ""; const a = new Date(f + "T12:00:00"), b = new Date(); let y = b.getFullYear() - a.getFullYear(); if (b < new Date(b.getFullYear(), a.getMonth(), a.getDate())) y--; return y > 0 && y < 120 ? y + " años" : ""; };

const IC = {
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  estudio: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  curso: '<circle cx="12" cy="9" r="5"/><path d="M8.5 13 7 21l5-3 5 3-1.5-8"/>',

};

  ["cedula", "Cédula o RIF"], ["estudio", "Título o constancia de estudios"], ["curso", "Certificado de curso"],
  ["reposo", "Récipe o reposo médico (por una falta)"], ["medico", "Exámenes y análisis médicos"], ["constancia", "Constancia o carta"], ["otro", "Otro documento"]
];

/* Estado */
let YO = "", SOY_DUENO = false, OBJ = "", P = {}, INFO = {}, DOCS = [], pest = "perfil", filtroDoc = "todos", cambios = false, nuevoDoc = null;
const qs = new URLSearchParams(location.search);

auth.onAuthStateChanged(async u => {
  if (!u) { location.replace("index.html"); return; }
  YO = (u.email || "").toLowerCase(); SOY_DUENO = YO === DUENO;
  if (SOY_DUENO && qs.has("equipo")) return directorio();
  OBJ = SOY_DUENO && qs.get("u") ? qs.get("u").toLowerCase() : YO;

});

/* Datos de la persona: su perfil + lo que ya sabe el panel (ficha de empleado o equipo) */
async function infoDe(em){
  if (em === DUENO) return { rol: "Dueño", tipo: "dueno" };
  const r = { tipo: "" };
  try { const s = await db.collection("empleados").where("acceso.email", "==", em).limit(1).get();
    if (!s.empty) { const e = s.docs[0].data(); Object.assign(r, { tipo: "empleado", empId: s.docs[0].id, nombre: e.nombre, cedula: e.cedula, nacimiento: e.nacimiento, telefono: e.telefono, codigo: e.codigo, rol: (e.roles || []).join(", ") || "Taller" }); } } catch (e) { console.warn(e); }
  if (!r.tipo) { try { const d = await db.collection("equipo").doc(em).get(); if (d.exists) { const x = d.data(); Object.assign(r, { tipo: "equipo", nombre: x.nombre, rol: x.rol === "administrador" ? "Administrador" : "Ayudante" }); } } catch (e) { console.warn(e); } }
  return r;
}
async function cargar(){
  const propio = OBJ === YO;
  $("titulo").textContent = propio ? "Mi perfil" : "Perfil";
  $("volver").href = propio ? (document.referrer.includes("personal.html") ? "personal.html" : "index.html") : "perfil.html?equipo";

/* ---------- Foto de perfil (recortada en cuadrado y comprimida) ---------- */
function leerImagen(file){ return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = r.result; }; r.onerror = no; r.readAsDataURL(file); }); }
async function comprimir(file, lado, calidad, tope, cuadrado){
  const im = await leerImagen(file);
  const c = document.createElement("canvas"), x = c.getContext("2d");
  if (cuadrado) { const s = Math.min(im.width, im.height); c.width = c.height = Math.min(lado, s); x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, c.width, c.height); }
  else { const k = Math.min(1, lado / Math.max(im.width, im.height)); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); }
  let q = calidad, url = c.toDataURL("image/jpeg", q);
  while (url.length > tope && q > .35) { q -= .08; url = c.toDataURL("image/jpeg", q); }
  return url;
}
async function cambiarFoto(e){
  const f = e.target.files[0]; if (!f) return;
  try {
    const url = await comprimir(f, 480, .85, 140000, true);
    $("foto-img").style.backgroundImage = `url('${url}')`; $("foto-img").textContent = "";
    await db.collection("perfiles").doc(OBJ).set({ foto: url, email: OBJ, actualizado: FV.serverTimestamp() }, { merge: true });
    P.foto = url; $("mini-av").style.backgroundImage = `url("${url}")`; toast("Foto actualizada ✓");
  } catch (err) { console.error(err); toast("No se pudo cambiar la foto. Prueba con otra imagen."); }
}

async function elegirArchivo(e){
  const f = e.target.files[0]; if (!f) return;
  const esPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  if (!esPdf && !/^image\//.test(f.type)) { toast("Solo fotos o PDF."); return; }
  if (esPdf && f.size > MAX_ARCHIVO) { toast(`Ese PDF pesa ${peso(f.size)}. El máximo es ${peso(MAX_ARCHIVO)}: tómale una foto o comprímelo.`); return; }
  const base = f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim(); const baseM = base.charAt(0).toUpperCase() + base.slice(1);
  const adiv = /recip|reposo|medic|justif/i.test(f.name) ? "reposo" : /cedula|rif/i.test(f.name) ? "cedula" : /curso|certif/i.test(f.name) ? "curso" : /titulo|bachiller|notas/i.test(f.name) ? "estudio" : /analisis|examen|laborator|hematol/i.test(f.name) ? "medico" : "otro";
  nuevoDoc = { archivo: f, tipo: esPdf ? "pdf" : "img", tamano: f.size, categoria: adiv, titulo: /^(img|image|photo|foto|scan)\s?\d*/i.test(base) || !base ? CAT[adiv].split(" (")[0] : baseM.slice(0, 80) };
  if (adiv === "reposo") nuevoDoc.desde = nuevoDoc.hasta = hoy();
  pintarDocumentos();
}
const leerComoURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
async function subirDoc(){
  const nd = nuevoDoc, err = t => { const n = $("nd-err"); n.textContent = t; n.hidden = false; };
  if (!nd.titulo.trim()) return err("Escribe el nombre del documento.");
  if (nd.categoria === "reposo" && !nd.desde) return err("Indica desde qué día faltaste.");
  if (nd.categoria === "reposo" && nd.hasta && nd.hasta < nd.desde) return err("La fecha «hasta» no puede ser antes de «desde».");
  const b = $("nd-ok"); b.disabled = true; b.textContent = "Subiendo…";
  try {
    const datos = nd.tipo === "pdf" ? await leerComoURL(nd.archivo) : await comprimir(nd.archivo, 1700, .82, 650000, false);
    const id = nid(), ref = db.collection("perfiles").doc(OBJ);
    const meta = { categoria: nd.categoria, titulo: nd.titulo.trim(), tipo: nd.tipo, peso: Math.round(datos.length * .75), nota: (nd.nota || "").trim(),
      fecha: nd.categoria === "reposo" ? "" : nd.fecha || "", desde: nd.categoria === "reposo" ? nd.desde : "", hasta: nd.categoria === "reposo" ? (nd.hasta || nd.desde) : "",
      subido: FV.serverTimestamp(), subidoPor: YO, revisado: SOY_DUENO };
    const lote = db.batch();
    lote.set(ref.collection("archivos").doc(id), { datos });
    lote.set(ref.collection("documentos").doc(id), meta);
    lote.set(ref, { email: OBJ, docs: DOCS.length + 1, docsSinRevisar: DOCS.filter(d => !d.revisado).length + (SOY_DUENO ? 0 : 1), ultimoDoc: FV.serverTimestamp() }, { merge: true });
    await lote.commit();
    DOCS.unshift(Object.assign({ id }, meta, { subido: { seconds: Date.now() / 1000 } }));
    nuevoDoc = null; filtroDoc = "todos"; toast(nd.categoria === "reposo" ? "Récipe enviado. El dueño ya lo puede ver ✓" : "Documento guardado ✓"); pintar();
  } catch (e) { console.error(e); b.disabled = false; b.textContent = "Guardar documento"; err(/size|large|exceed/i.test(e.message || "") ? "El archivo es muy pesado. Tómale una foto en lugar del PDF." : "No se pudo subir. Revisa tu conexión."); }
}

/* Ver, compartir, marcar revisado o borrar un documento */
async function verDoc(d){
  if (!d) return;
  const v = document.createElement("div"); v.className = "visor"; v.setAttribute("role", "dialog"); v.setAttribute("aria-modal", "true");
  v.innerHTML = `<div class="hoja"><div class="it" style="background:none;padding:0"><span class="ic">${ico(d.categoria)}</span><div><b>${esc(d.titulo)}</b><small>${esc(CAT[d.categoria] || "")}</small></div><button class="x" type="button" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="datos" style="margin-top:10px">
      ${d.categoria === "reposo" ? `<div><span>Faltó</span><b>${esc(fecha(d.desde))}${d.hasta && d.hasta !== d.desde ? " al " + esc(fecha(d.hasta)) : ""}</b></div>` : d.fecha ? `<div><span>Fecha del documento</span><b>${esc(fecha(d.fecha))}</b></div>` : ""}
      <div><span>Subido</span><b>${esc(tsFecha(d.subido))}</b></div>
      ${d.nota ? `<div><span>Nota</span><b>${esc(d.nota)}</b></div>` : ""}
      <div><span>Estado</span><b>${d.revisado ? "Revisado por el dueño" : "Por revisar"}</b></div></div>
    <div id="v-cont"><p class="cargando" style="padding:30px">Abriendo…</p></div>
    <div class="acc" id="v-acc"></div></div>`;
  document.body.appendChild(v); document.documentElement.style.overflow = "hidden";
  const cerrar = () => { v.remove(); document.documentElement.style.overflow = ""; if (v.url) URL.revokeObjectURL(v.url); };
  v.addEventListener("click", e => { if (e.target === v || e.target.closest("[data-cerrar]")) cerrar(); });
  let datos = "";
  try { const a = await db.collection("perfiles").doc(OBJ).collection("archivos").doc(d.id).get(); datos = a.exists ? a.data().datos : ""; } catch (e) { console.error(e); }
  if (!datos) { $("v-cont").innerHTML = `<p class="msg err">No se pudo abrir el archivo.</p>`; }
  const blob = datos ? await (await fetch(datos)).blob() : null;
  const nombreArch = (d.titulo || "documento").replace(/[^\wáéíóúñÁÉÍÓÚÑ .-]+/g, "").trim() + (d.tipo === "pdf" ? ".pdf" : ".jpg");
  if (blob) { v.url = URL.createObjectURL(blob);
    $("v-cont").innerHTML = d.tipo === "pdf" ? `<p class="ayuda" style="margin:14px 0 0;text-align:center">Documento PDF · ${peso(blob.size)}</p>` : `<img src="${v.url}" alt="${esc(d.titulo)}">`; }
  const acc = $("v-acc");
  acc.innerHTML = (blob ? `<button class="btn oro" type="button" id="v-abrir">${d.tipo === "pdf" ? "Abrir PDF" : "Compartir / guardar"}</button>` : "")
    + (SOY_DUENO && OBJ !== YO ? `<button class="btn ${d.revisado ? "borde" : "suave"}" type="button" id="v-rev">${d.revisado ? "Marcar por revisar" : "Marcar revisado ✓"}</button>` : "")
    + (editable() ? `<button class="btn peligro" type="button" id="v-del">Borrar</button>` : "");
  const ab = $("v-abrir"); if (ab) ab.addEventListener("click", async () => {
    const file = new File([blob], nombreArch, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: d.titulo }); } catch (e) {} }
    else { const a = document.createElement("a"); a.href = v.url; a.target = "_blank"; a.rel = "noopener"; if (d.tipo !== "pdf") a.download = nombreArch; document.body.appendChild(a); a.click(); a.remove(); }
  });
  const rv = $("v-rev"); if (rv) rv.addEventListener("click", async () => {
    rv.disabled = true; const nuevo = !d.revisado;
    try { const ref = db.collection("perfiles").doc(OBJ), lote = db.batch();
      lote.update(ref.collection("documentos").doc(d.id), { revisado: nuevo });
      d.revisado = nuevo; lote.set(ref, { docsSinRevisar: DOCS.filter(x => !x.revisado).length }, { merge: true }); await lote.commit();
      cerrar(); toast(nuevo ? "Marcado como revisado ✓" : "Marcado por revisar"); pintar(); }
    catch (e) { console.error(e); d.revisado = !nuevo; rv.disabled = false; toast("No se pudo cambiar."); }
  });
  const dl = $("v-del"); if (dl) dl.addEventListener("click", async () => {
    if (dl.dataset.ok !== "1") { dl.dataset.ok = "1"; dl.textContent = "¿Seguro? Toca otra vez"; return; }
    dl.disabled = true;
    try { const ref = db.collection("perfiles").doc(OBJ), lote = db.batch(), resto = DOCS.filter(x => x.id !== d.id);
      lote.delete(ref.collection("documentos").doc(d.id)); lote.delete(ref.collection("archivos").doc(d.id));
      lote.set(ref, { docs: resto.length, docsSinRevisar: resto.filter(x => !x.revisado).length }, { merge: true }); await lote.commit();
      DOCS = resto; cerrar(); toast("Documento borrado."); pintar(); }
    catch (e) { console.error(e); dl.disabled = false; toast("No se pudo borrar."); }
  });
}

/* ---------- Directorio del equipo (solo el dueño) ---------- */
async function directorio(){
  $("titulo").textContent = "Perfiles del equipo"; $("volver").href = "index.html";
  try {
    const [ps, es, eq] = await Promise.all([db.collection("perfiles").get(), db.collection("empleados").get(), db.collection("equipo").get()]);
    const perf = Object.fromEntries(ps.docs.map(d => [d.id, d.data()]));
    if (perf[DUENO] && perf[DUENO].foto) $("mini-av").style.backgroundImage = `url("${perf[DUENO].foto}")`;
    const gente = [];
    eq.docs.forEach(d => { const x = d.data(); gente.push({ em: d.id, nombre: x.nombre, rol: x.rol === "administrador" ? "Administrador" : "Ayudante", grupo: "Administración", activo: x.activo !== false }); });
    es.docs.forEach(d => { const x = d.data(), em = ((x.acceso && x.acceso.email) || "").toLowerCase(); gente.push({ em, nombre: x.nombre, rol: (x.roles || []).join(", ") || "Taller", grupo: "Taller", activo: x.activo !== false, sinAcceso: !em }); });
    const tarjeta = (g, n) => { const p = perf[g.em] || {}, pct = completitud(p, p.docs || 0), ini = ((p.nombre || g.nombre || "?").trim()[0] || "?").toUpperCase();
      const cont = `<span class="av" style="${p.foto ? `background-image:url('${p.foto}')` : ""}">${p.foto ? "" : esc(ini)}</span>
        <div><b>${esc(p.nombre || g.nombre || g.em)}</b><small>${esc(g.rol)}${p.ingreso ? " · " + esc(antiguedad(p.ingreso)) : ""}</small>
        <small>${g.sinAcceso ? "Sin acceso al portal: dale acceso en su ficha" : `${p.docs || 0} documento${(p.docs || 0) === 1 ? "" : "s"} · perfil ${pct} %`}</small>
        ${g.sinAcceso ? "" : `<span class="mb"><i style="width:${pct}%"></i></span>`}</div>
        ${p.docsSinRevisar ? `<span class="nuevo">${p.docsSinRevisar} nuevo${p.docsSinRevisar === 1 ? "" : "s"}</span>` : ""}`;
      return g.sinAcceso ? `<div class="persona" style="opacity:.6;animation-delay:${n * 40}ms">${cont}</div>` : `<a class="persona" href="perfil.html?u=${encodeURIComponent(g.em)}" style="animation-delay:${n * 40}ms">${cont}</a>`; };
    const activos = gente.filter(g => g.activo);
    const porRevisar = activos.reduce((s, g) => s + ((perf[g.em] || {}).docsSinRevisar || 0), 0);
    $("app").innerHTML = `<section class="portada" style="padding-bottom:30px"><h2>Tu equipo</h2>
        <div class="pastillas"><span>${activos.length} persona${activos.length === 1 ? "" : "s"}</span>${porRevisar ? `<span>${porRevisar} documento${porRevisar === 1 ? "" : "s"} por revisar</span>` : `<span>Todo revisado ✓</span>`}</div></section>
      <main style="margin-top:14px">
        <a class="persona" href="perfil.html" style="margin-bottom:6px"><span class="av" style="${perf[DUENO] && perf[DUENO].foto ? `background-image:url('${perf[DUENO].foto}')` : ""}">${perf[DUENO] && perf[DUENO].foto ? "" : "D"}</span><div><b>Mi perfil</b><small>Dueño · edita tu foto, reseña y datos</small></div></a>
        ${["Taller", "Administración"].map(gr => { const ls = activos.filter(g => g.grupo === gr).sort((a, b) => ((perf[b.em] || {}).docsSinRevisar || 0) - ((perf[a.em] || {}).docsSinRevisar || 0) || String(a.nombre).localeCompare(String(b.nombre)));
          return ls.length ? `<p class="titulo-dir">${gr}</p><div class="gente">${ls.map(tarjeta).join("")}</div>` : ""; }).join("")}
        ${!activos.length ? `<p class="vacio" style="margin-top:20px">Aún no hay empleados. Agrégalos en Empleados y nómina y dales acceso al portal.</p>` : ""}
        <p class="ayuda" style="margin-top:20px;text-align:center">Cada persona completa su perfil y sube sus documentos desde su teléfono. Tú pones la fecha de ingreso desde su perfil.</p>
      </main>`;
  } catch (e) { console.error(e); $("app").innerHTML = `<p class="cargando">No se pudieron cargar los perfiles. ${/permission/i.test(e.code || e.message || "") ? "Faltan los permisos en Firebase (reglas de perfiles)." : "Revisa tu conexión."}</p>`; }
}
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
